name: Continuous Delivery & Deployment (CD Agent)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment Strategy'
        required: true
        default: 'canary'
        type: choice
        options:
          - canary
          - rolling_update
          - blue_green

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # Mandatory for Sigstore Cosign keyless OIDC signing

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBE_NAMESPACE: descopesampleapp-prod

jobs:
  build-and-harden-container:
    name: Containerize & Vulnerability Gate
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Multi-Stage Build & Push with Layer Cache
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Security Vulnerability Gate (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fails build on CRITICAL vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Keyless Cryptographic Attestation (Cosign)
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-image.outputs.digest }}

  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    needs: [build-and-harden-container]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://descopesampleapp.production.cluster.local
    steps:
      - name: Checkout Manifests
        uses: actions/checkout@v4

      - name: Configure Kubernetes Credentials
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Zero-Trust Security Policies
        run: |
          kubectl apply -f k8s/network-policy.yaml -n ${{ env.KUBE_NAMESPACE }}
          kubectl apply -f k8s/pdb.yaml -n ${{ env.KUBE_NAMESPACE }}
          kubectl apply -f k8s/hpa.yaml -n ${{ env.KUBE_NAMESPACE }}

      - name: Progressive Deployment Rollout
        run: |
          echo "Deploying image with cryptographic digest verification..."
          kubectl set image deployment/descopesampleapp descopesampleapp=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-harden-container.outputs.image_digest }} -n ${{ env.KUBE_NAMESPACE }}
          
          # Zero-downtime rollout health check
          kubectl rollout status deployment/descopesampleapp -n ${{ env.KUBE_NAMESPACE }} --timeout=180s

      - name: Automated Rollback on Deployment Failure
        if: failure()
        run: |
          echo "CRITICAL: Health probes failed. Executing zero-downtime automated rollback..."
          kubectl rollout undo deployment/descopesampleapp -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/descopesampleapp -n ${{ env.KUBE_NAMESPACE }}
          exit 1
